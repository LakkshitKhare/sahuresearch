stant Professor and Ramanujan Faculty Fellow at the Centre of Innovation and Research, Kalinga Institute of Industrial Technology (KIIT) Deemed to be University, Bhubaneswar, Odisha.","His research programme is interdisciplinary, spanning electrocatalysis and electrochemical energy conversion, electrochemical sensors, ionic polymers and membranes, and nanoscale optical probes. The work addresses two connected challenges: the efficient and selective conversion of small molecules — including water splitting for hydrogen and the reduction of CO₂ — and the sensitive detection, separation and removal of contaminants such as PFAS compounds and heavy metals from water.","His peer-reviewed work has appeared in journals including Environmental Science & Technology Letters, ACS Omega, ACS ES&T Engineering and Energy & Fuels. Earlier in his career he served on the faculty of Amity University, Mumbai, and undertook collaborative research on electrochemical sensing and photocatalysis at Louisiana State University, Baton Rouge."],facts:[{term:"Academic position",value:"Assistant Professor and Ramanujan Faculty Fellow"},{term:"Institution",value:"Kalinga Institute of Industrial Technology (KIIT) Deemed to be University"},{term:"Centre",value:"Centre of Innovation and Research"},{term:"Location",value:"Bhubaneswar 751024, Odisha, India"}],interests:["Electrochemistry","Electrocatalysis","Nanotechnology","Electrochemical sensors","Ionic polymers","Membranes","Water treatment","Optical bioimaging"],career:[{period:"Present",role:"Assistant Professor & Ramanujan Faculty Fellow",org:"Centre of Innovation and Research, KIIT Deemed to be University, Bhubaneswar"},{period:"Prior",role:"Faculty, Chemistry",org:"Amity Institute of Biotechnology, Amity University, Mumbai"},{period:"Prior",role:"Collaborative research",org:"Electrochemical sensing and photocatalysis, Louisiana State University, Baton Rouge"}],careerNote:"Full education and appointment history will be updated shortly."},no=[{id:"electrified-systems",index:"01",label:"Electrified molecular systems",title:"Electrified Molecular Systems for Sustainable Catalysis and Chemical Fuels",short:"Scalable catalytic materials and tailored electrode surfaces that promote catalysis — including water splitting and CO₂ conversion — through the breaking and making of chemical bonds.",description:"The laboratory is pursuing the development of scalable catalytic materials and tailored electrode surfaces that promote catalysis, including water splitting and CO₂ conversion, through the breaking and making of chemical bonds. The work aims to produce targeted molecules such as H₂ more efficiently, with high selectivity and rapid rates of production.",applications:["Industrial-scale water electrolysers","Fuel cell technologies","CO₂ conversion to chemical fuels","High-selectivity H₂ production"],keywords:["Electrocatalysis","Water splitting","CO₂ reduction","HER","Electrolyser"],figure:"electrolyser",align:"left"},{id:"electrochemical-sensors",index:"02",label:"Electrochemical sensors",title:"Design of Electrochemical Sensors for Healthcare and Environmental Technologies",short:"Engineering electrode surfaces to create highly sensitive electrochemical sensors for detecting small molecules such as PFAS compounds through redox processes.",description:"Electrode surfaces are engineered to create highly sensitive electrochemical sensors for detecting small molecules such as PFAS compounds through redox processes. The programme also covers potentiometric sensors, ion-selective electrodes and biosensors, including specific biomarker detection, biochemical assays and antibody–antigen interactions.",applications:["PFAS compound detection","Potentiometric sensors","Ion-selective electrodes","Biomarker detection and biosensors","Antibody–antigen interaction assays"],keywords:["Biosensors","Redox sensing","Ion-selective electrodes","PFAS","Point-of-care"],figure:"sensor",align:"right"},{id:"ionic-polymers",index:"03",labe
